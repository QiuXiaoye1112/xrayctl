name: xrayctl final fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/xrayctl-final-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply scoped fixes
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          sh = Path('xrayctl.sh')
          s = sh.read_text()

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 match, got {count}')
              return text.replace(old, new, 1)

          def patch_scope(text, start_marker, end_marker, old, new, label):
              start = text.index(start_marker)
              end = text.index(end_marker, start)
              block = text[start:end]
              patched = replace_once(block, old, new, label)
              return text[:start] + patched + text[end:]

          # 1) Prefer the currently running script when installing/updating the quick command.
          s = patch_scope(
              s,
              'install_quick_command() {',
              '\n# ============================================================\n# Uninstall',
              "\n".join([
                  "  if [[ -f $QUICK_COMMAND ]] && grep -q '^# xrayctl - Xray Linux terminal manager' \"$QUICK_COMMAND\" 2>/dev/null; then",
                  "    source=$QUICK_COMMAND",
                  "  elif [[ -z $source || ! -r $source ]] || ! grep -q '^# xrayctl - Xray Linux terminal manager' \"$source\" 2>/dev/null; then",
              ]),
              "\n".join([
                  "  if [[ -n $source && -r $source ]] && grep -q '^# xrayctl - Xray Linux terminal manager' \"$source\" 2>/dev/null; then",
                  "    :",
                  "  elif [[ -f $QUICK_COMMAND ]] && grep -q '^# xrayctl - Xray Linux terminal manager' \"$QUICK_COMMAND\" 2>/dev/null; then",
                  "    source=$QUICK_COMMAND",
                  "  else",
              ]),
              'quick command source priority',
          )

          # 2) Residual count is data, not a shell failure status.
          s = patch_scope(
              s,
              '_scan_xrayctl_residuals() {',
              '\n# ============================================================\n# Three uninstall level implementations',
              '  return $count',
              '  return 0',
              'residual scanner status',
          )

          # 3) Level-1 uninstall must continue cleanup even if an individual step fails.
          old_cleanup = "\n".join([
              '  _uninstall_snapshot_metadata',
              '  _uninstall_disable_timers',
              '  _uninstall_remove_managed_certs',
              '  _uninstall_remove_cloudflare',
              '  _uninstall_remove_certbot',
              '  _uninstall_xray_core',
              '  _uninstall_remove_systemd_overrides',
              '  _uninstall_remove_runtime_group',
              '  _uninstall_remove_quick_command',
              '  _cleanup_legacy_resources',
              '  _uninstall_remove_config',
              '  _uninstall_remove_logs',
              '',
              '  local residual_count',
              '  _scan_xrayctl_residuals residual_count',
          ])
          new_cleanup = "\n".join([
              '  _uninstall_snapshot_metadata',
              '  local step_failures=0 residual_count=0',
              '  _uninstall_disable_timers           || ((step_failures+=1))',
              '  _uninstall_remove_managed_certs     || ((step_failures+=1))',
              '  _uninstall_remove_cloudflare        || ((step_failures+=1))',
              '  _uninstall_remove_certbot           || ((step_failures+=1))',
              '  _uninstall_xray_core                || ((step_failures+=1))',
              '  _uninstall_remove_systemd_overrides || ((step_failures+=1))',
              '  _uninstall_remove_runtime_group     || ((step_failures+=1))',
              '  _uninstall_remove_quick_command     || ((step_failures+=1))',
              '  _cleanup_legacy_resources           || ((step_failures+=1))',
              '  _uninstall_remove_config            || ((step_failures+=1))',
              '  _uninstall_remove_logs              || ((step_failures+=1))',
              '',
              '  _scan_xrayctl_residuals residual_count',
              '',
              '  if ((step_failures > 0)); then',
              '    warn "完全卸载有 ${step_failures} 个清理步骤失败，请结合残留检查确认。"',
              '  fi',
          ])
          s = patch_scope(
              s,
              '_xrayctl_uninstall_level_1() {',
              '\n_xrayctl_uninstall_level_0() {',
              old_cleanup,
              new_cleanup,
              'level-1 uninstall cleanup',
          )

          # 4) Restore: only structural JSON validation before install; run full Xray validation after certs are restored.
          s = patch_scope(
              s,
              'restore_backup() {',
              '\nshow_status() {',
              '  validate_candidate "$temp/$extract_config" || { rm -rf "$temp"; die "备份配置验证失败。"; }',
              "  jq -e 'type==\"object\" and (.inbounds|type==\"array\") and (.outbounds|type==\"array\")' \\\n    \"$temp/$extract_config\" >/dev/null || { rm -rf \"$temp\"; die \"备份配置 JSON 结构无效。\"; }",
              'restore pre-validation',
          )
          s = patch_scope(
              s,
              'restore_backup() {',
              '\nshow_status() {',
              '  if ! restart_service; then\n    error "恢复后服务失败，正在回滚配置、元数据和证书。"',
              '  if ! validate_candidate "$CONFIG_FILE" || ! restart_service; then\n    error "恢复后配置验证或服务启动失败，正在回滚配置、元数据和证书。"',
              'restore post-validation condition',
          )
          s = patch_scope(
              s,
              'restore_backup() {',
              '\nshow_status() {',
              '    die "恢复后服务失败，已回滚配置、元数据和证书。"',
              '    die "恢复失败，已回滚配置、元数据和证书。"',
              'restore rollback message',
          )

          # 5) CLI/systemd must receive non-zero status for real certificate failures.
          s = patch_scope(
              s,
              'issue_certificate() {',
              '\nregister_certificate_metadata() {',
              '    warn "证书签发失败，请查看上方 Certbot 输出的具体原因。"\n    return 0',
              '    warn "证书签发失败，请查看上方 Certbot 输出的具体原因。"\n    return 1',
              'cert issue status',
          )

          renew_start = s.index('renew_managed_certificates() {')
          renew_end = s.index('\nrenew_certificate_command() {', renew_start)
          renew_block = s[renew_start:renew_end]
          tail = '  else\n    info "没有需要续期的证书。"\n  fi\n}'
          renew_block = replace_once(
              renew_block,
              tail,
              '  else\n    info "没有需要续期的证书。"\n  fi\n  if ((failed > 0)); then\n    return 1\n  fi\n  return 0\n}',
              'renew-auto status',
          )
          s = s[:renew_start] + renew_block + s[renew_end:]

          s = patch_scope(
              s,
              'delete_managed_certificate() {',
              '\nmanage_inbound_certificate_menu() {',
              '|| { warn "Let\'s Encrypt 证书删除失败，托管副本未改动。"; return 0; }',
              '|| { warn "Let\'s Encrypt 证书删除失败，托管副本未改动。"; return 1; }',
              'cert delete status',
          )

          # 6) Remove obsolete subscription wording while keeping all-share-links behavior.
          s = replace_once(
              s,
              '没有可生成订阅链接的入站。',
              '没有可生成分享链接的入站。',
              'share warning wording',
          )
          s = replace_once(
              s,
              '3) 订阅链接\\n4) 删除入站',
              '3) 全部分享链接\\n4) 删除入站',
              'menu wording',
          )
          sh.write_text(s)

          readme = Path('README.md')
          r = readme.read_text()
          r = replace_once(r, '- VLESS、VMess、Trojan 分享链接及 Base64 订阅内容', '- VLESS、VMess、Trojan 分享链接', 'README feature')
          r = replace_once(r, '│  ├─ 订阅链接（输出各入站用户的原始分享链接）', '│  ├─ 全部分享链接（输出各入站用户的原始分享链接）', 'README menu')
          r = replace_once(r, 'xrayctl subscription             # 全部入站 Base64 订阅内容\n', '', 'README command')
          readme.write_text(r)
          PY

      - name: Validate
        shell: bash
        run: |
          bash -n xrayctl.sh
          git diff --check
          ! grep -nE 'xrayctl subscription|Base64 订阅|订阅链接' README.md
          ! grep -n '没有可生成订阅链接的入站' xrayctl.sh
          grep -n '全部分享链接' xrayctl.sh README.md
          grep -n 'if ((failed > 0)); then' xrayctl.sh
          grep -n 'validate_candidate "$CONFIG_FILE" || ! restart_service' xrayctl.sh

      - name: Commit fixes and remove one-shot workflow
        shell: bash
        run: |
          rm -f .github/workflows/xrayctl-final-fix.yml
          git config user.name 'OpenAI'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add xrayctl.sh README.md .github/workflows/xrayctl-final-fix.yml
          git diff --cached --check
          git commit -m 'fix: finalize restore uninstall and CLI failure semantics'
          git push origin HEAD:main
